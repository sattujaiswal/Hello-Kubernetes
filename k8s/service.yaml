apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi
spec:
  type: LoadBalancer   # EKS will create an AWS ELB automatically
  selector:
    app: fastapi       # must match Deployment labels
  ports:
    - name: http
      port: 80         # external port (ELB)
      targetPort: 80   # container port inside the pod
